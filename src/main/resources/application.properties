spring.application.name=BeJacob-Backend
server.port=${PORT:8080}
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
spring.profiles.active=dev
spring.datasource.driver-class-name=org.postgresql.Driver
api.security.token.secret=${JWT_SECRET}
spring.flyway.placeholders.ADMIN_PASS=${ADMIN_PASS}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.reset-password-url=${URL_RESET_PASSWORD_PAGE:http://localhost:5173/reset-password}

google.calendar.id=${GOOGLE_CALENDAR_ID}
google.credentials.path=${GOOGLE_CREDENTIALS_PATH}