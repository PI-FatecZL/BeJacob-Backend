spring.datasource.url=${POSTGRES_DB_DEV}
spring.datasource.username=${POSTGRES_DEV_USER}
spring.datasource.password=${POSTGRES_DEV_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
api.security.token.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS}

spring.flyway.placeholders.ADMIN_PASS=${ADMIN_PASS}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.reset-password-url=${URL_RESET_PASSWORD_PAGE:http://localhost:5173/reset-password}
app.cors.allowed-origins=${CORS_ORIGINS_DEV}
spring.jpa.hibernate.ddl-auto=update
